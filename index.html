<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Virtual Terrarium</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css" />
        <script src="./script.js" defer></script>
</head>
<body>
    <h1> My Terrarium </h1>
    <div id="page"> 
        <div id="left-container" class="container">
            <div class="plant-holder">
                <img id="plant1" class="plant" src="./images/plant1.png" alt="Plant 1">
            </div>
            <div class="plant-holder">
                <img id="plant2" class="plant" src="./images/plant2.png" alt="Plant 2">
            </div>
            <div class="plant-holder">
                <img id="plant3" class="plant" src="./images/plant3.png" alt="Plant 3">
            </div>
            <div class="plant-holder">
                <img id="plant4" class="plant" src="./images/plant4.png" alt="Plant 4">
            </div>
            <div class="plant-holder">
                <img id="plant5" class="plant" src="./images/plant5.png" alt="Plant 5">
            </div>                        
            <div class="plant-holder">
                <img  id="plant6" class="plant" src="./images/plant6.png" alt="Plant 6">
            </div>
            <div class="plant-holder">
                <img id="plant7" class="plant" src="./images/plant7.png" alt="Plant 7">
            </div>
        </div>

        <div id="right-container" class="container">
            <div class="plant-holder">
                <img id="plant8" class="plant" src="./images/plant8.png" alt="Plant 8">
            </div>
            <div class="plant-holder">
                <img id="plant9" class="plant" src="./images/plant9.png" alt="Plant 9">
            </div>
            <div class="plant-holder">
                <img id="plant10" class="plant" src="./images/plant10.png" alt="Plant 10">
            </div>
            <div class="plant-holder">
                <img id="plant11" class="plant" src="./images/plant11.png" alt="Plant 11">
            </div>
            <div class="plant-holder">
                <img id="plant12" class="plant" src="./images/plant12.png" alt="Plant 12">
            </div>                        
            <div class="plant-holder">
                <img id="plant13" class="plant" src="./images/plant13.png" alt="Plant 13">
            </div>
            <div class="plant-holder">
                <img id="plant14" class="plant" src="./images/plant14.png" alt="Plant 14">
            </div>
        </div>

        <div id="terrarium">
            <div class="jar-top"></div>
            <div class="jar-walls">
                <div class="jar-glossy-long"></div>
                <div class="jar-glossy-short"></div>
            </div>
            <div class="dirt"></div>
            <div class="jar-bottom"></div>
        </div>
    </div>
</body>
</html>
